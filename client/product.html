<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details | NexStore</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <header class="navbar">
        <div class="container">
            <a href="index.html" class="logo">Nex<span>Store</span></a>
            <div class="nav-links">
                <a href="shop.html" class="nav-item">Shop</a>
                <a href="cart.html" class="cart-btn">
                    <i class="ph ph-shopping-cart-simple"></i>
                    <span class="cart-count">0</span>
                </a>
            </div>
        </div>
    </header>

    <main class="container" style="padding: 140px 20px 80px;">
        <div id="product-detail-container" class="product-detail-layout">
            <div class="loading" style="text-align: center; padding: 100px; color: var(--text-muted);">
                <i class="ph ph-spinner-gap ph-spin" style="font-size: 3rem; margin-bottom: 20px;"></i>
                <p>Curating details...</p>
            </div>
        </div>
    </main>

    <style>
        .product-detail-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 80px;
            align-items: start;
        }
        .product-v-image {
            position: sticky;
            top: 120px;
        }
        .product-v-image img {
            width: 100%;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--glass-border);
        }
        .product-v-info {
            padding: 20px 0;
        }
        .product-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }
        .product-v-info h1 {
            font-size: 3.5rem;
            line-height: 1.1;
            margin-bottom: 20px;
        }
        .product-v-price {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--white);
            margin-bottom: 32px;
        }
        .product-v-description {
            font-size: 1.15rem;
            color: var(--text-muted);
            margin-bottom: 40px;
            line-height: 1.8;
        }
        .product-stats {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            padding: 24px;
            border-radius: var(--radius);
            margin-bottom: 40px;
            display: flex;
            gap: 40px;
        }
        .stat-item span {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
        .stat-item strong {
            font-size: 1.1rem;
            color: var(--white);
        }
        @media (max-width: 992px) {
            .product-detail-layout { grid-template-columns: 1fr; gap: 40px; }
            .product-v-image { position: static; }
            .product-v-info h1 { font-size: 2.5rem; }
        }
    </style>

    <script src="js/app.js" type="module"></script>
    <script type="module">
        import { addToCart } from './js/app.js';
        
        const params = new URLSearchParams(window.location.search);
        const productId = params.get('id');
        const container = document.getElementById('product-detail-container');

        const fetchProduct = async () => {
            try {
                const res = await fetch(`http://localhost:5000/api/products/${productId}`);
                const data = await res.json();
                if (data.success) {
                    renderDetails(data.data);
                }
            } catch (err) {
                // Fallback / Error
                container.innerHTML = `<p class="error">Failed to load product details.</p>`;
            }
        };

        const renderDetails = (p) => {
            container.innerHTML = `
                <div class="product-v-image reveal">
                    <img src="${p.image}" alt="${p.name}">
                </div>
                <div class="product-v-info reveal">
                    <div class="product-meta">
                        <span class="product-tag">${p.category}</span>
                        <span style="color: var(--text-muted); font-size: 0.9rem;">By ${p.vendor?.name || 'NexStore'}</span>
                    </div>
                    <h1>${p.name}</h1>
                    <div class="product-v-price">$${p.price.toFixed(2)}</div>
                    <p class="product-v-description">${p.description}</p>
                    
                    <div class="product-stats">
                        <div class="stat-item">
                            <span>Status</span>
                            <strong>${p.stock > 0 ? 'Available' : 'Sold Out'}</strong>
                        </div>
                        <div class="stat-item">
                            <span>Inventory</span>
                            <strong>${p.stock} Units</strong>
                        </div>
                    </div>

                    <div class="product-actions" style="display: block;">
                        <button class="btn btn-primary btn-lg" style="width: 100%;" ${p.stock <= 0 ? 'disabled' : ''} id="add-to-cart-btn">
                            <i class="ph ph-shopping-cart-simple"></i>
                            ${p.stock > 0 ? 'Add to Shopping Cart' : 'Currently Unavailable'}
                        </button>
                    </div>
                </div>
            `;
            
            // Re-trigger scroll animations
            if (window.setupScrollAnimations) window.setupScrollAnimations();
            
            document.getElementById('add-to-cart-btn')?.addEventListener('click', () => {
                // Since app.js is already loaded, we can use the globally available functions if they aren't hidden by module scope
                // But in ES modules, they are. So I'll just use the logic directly or ensure it's accessible.
                // The easiest way is to let app.js handle the click listener if we add the button later.
                // Or I can just copy the logic here or dispatch an event.
                const cart = JSON.parse(localStorage.getItem('cart')) || [];
                const existing = cart.find(item => item.product === p._id);
                if (existing) { existing.qty += 1; }
                else { cart.push({ product: p._id, name: p.name, price: p.price, image: p.image, qty: 1 }); }
                localStorage.setItem('cart', JSON.stringify(cart));
                window.dispatchEvent(new Event('cart-updated')); // If app.js listens for this
                // For now, let's just refresh the count and show a toast if we can find the function
                if (window.showToast) window.showToast(`${p.name} added to cart!`);
                else alert(`${p.name} added to cart!`);
                location.reload(); // Quick way to update count for now
            });
        };

        fetchProduct();
    </script>
</body>
</html>
