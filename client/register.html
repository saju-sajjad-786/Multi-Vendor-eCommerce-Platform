<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join | NexStore</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at top right, #1e293b, #0f172a);">
    
    <div class="auth-card" style="width: 100%; max-width: 500px; padding: 40px; background: var(--surface); border: 1px solid var(--glass-border); border-radius: 20px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);">
        <div style="text-align: center; margin-bottom: 32px;">
            <a href="index.html" class="logo" style="display: block; margin-bottom: 16px;">Nex<span>Store</span></a>
            <h2 style="font-size: 1.8rem;">Create an Account</h2>
            <p style="color: var(--text-muted);">Join our marketplace today</p>
        </div>

        <form id="register-form">
            <div style="margin-bottom: 16px;">
                <label style="display: block; margin-bottom: 8px; font-weight: 500;">Full Name</label>
                <input type="text" id="name" required style="width: 100%; padding: 12px 16px; background: var(--background); border: 1px solid var(--glass-border); border-radius: 10px; color: white; outline: none;" placeholder="John Doe">
            </div>
            <div style="margin-bottom: 16px;">
                <label style="display: block; margin-bottom: 8px; font-weight: 500;">Email Address</label>
                <input type="email" id="email" required style="width: 100%; padding: 12px 16px; background: var(--background); border: 1px solid var(--glass-border); border-radius: 10px; color: white; outline: none;" placeholder="john@example.com">
            </div>
            <div style="margin-bottom: 16px;">
                <label style="display: block; margin-bottom: 8px; font-weight: 500;">Are you a...</label>
                <select id="role" style="width: 100%; padding: 12px 16px; background: var(--background); border: 1px solid var(--glass-border); border-radius: 10px; color: white; outline: none;">
                    <option value="customer">Customer</option>
                    <option value="vendor">Vendor</option>
                </select>
            </div>
            <div style="margin-bottom: 24px;">
                <label style="display: block; margin-bottom: 8px; font-weight: 500;">Password</label>
                <input type="password" id="password" required minlength="6" style="width: 100%; padding: 12px 16px; background: var(--background); border: 1px solid var(--glass-border); border-radius: 10px; color: white; outline: none;" placeholder="••••••••">
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px;">Create Account</button>
        </form>

        <div style="text-align: center; margin-top: 32px; color: var(--text-muted);">
            Already have an account? <a href="login.html" style="color: var(--primary); font-weight: 600;">Sign In</a>
        </div>
    </div>

    <script type="module">
        const registerForm = document.getElementById('register-form');
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const role = document.getElementById('role').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('http://localhost:5000/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, role, password })
                });
                const data = await res.json();
                
                if (data.success) {
                    localStorage.setItem('user', JSON.stringify(data.user));
                    localStorage.setItem('token', data.token);
                    window.location.href = 'index.html';
                } else {
                    alert(data.message || 'Registration failed');
                }
            } catch (err) {
                alert('Connection error');
            }
        });
    </script>
</body>
</html>
