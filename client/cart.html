<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart | NexStore</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <header class="navbar">
        <div class="container">
            <a href="index.html" class="logo">Nex<span>Store</span></a>
            <div class="nav-links">
                <a href="shop.html" class="nav-item">Shop</a>
                <a href="cart.html" class="cart-btn active">
                    <i class="ph ph-shopping-cart-simple"></i>
                    <span class="cart-count">0</span>
                </a>
            </div>
        </div>
    </header>

    <main class="container" style="padding: 140px 20px 80px;">
        <h1 style="font-size: 3rem; margin-bottom: 48px;">Shopping Cart</h1>
        
        <div class="cart-layout">
            <div id="cart-items">
                <!-- Items -->
            </div>

            <aside class="cart-summary-card reveal">
                <h3 style="font-size: 1.5rem; margin-bottom: 24px;">Order Summary</h3>
                <div style="display: flex; justify-content: space-between; margin-bottom: 16px; color: var(--text-muted);">
                    <span>Subtotal</span>
                    <span id="subtotal" style="color: var(--white);">$0.00</span>
                </div>
                <div style="display: flex; justify-content: space-between; margin-bottom: 24px; color: var(--text-muted);">
                    <span>Shipping</span>
                    <span style="color: #10b981;">FREE</span>
                </div>
                <div style="display: flex; justify-content: space-between; font-weight: 800; font-size: 1.5rem; margin-bottom: 32px; border-top: 1px solid var(--glass-border); padding-top: 24px;">
                    <span>Total</span>
                    <span id="total" style="color: var(--primary);">$0.00</span>
                </div>
                <button class="btn btn-primary btn-lg" style="width: 100%;" onclick="window.location.href='checkout.html'">Proceed to Checkout</button>
            </aside>
        </div>
    </main>

    <script src="js/app.js" type="module"></script>
    <script type="module">
        let cart = JSON.parse(localStorage.getItem('cart')) || [];
        const itemsContainer = document.getElementById('cart-items');
        const totalEl = document.getElementById('total');
        const subtotalEl = document.getElementById('subtotal');

        const renderCart = () => {
            if (cart.length === 0) {
                itemsContainer.innerHTML = '<p style="text-align: center; padding: 100px; color: var(--text-muted);">Your cart is empty.</p>';
                return;
            }

            itemsContainer.innerHTML = cart.map((item, index) => `
                <div class="cart-item reveal">
                    <img src="${item.image}" alt="">
                    <div class="cart-item-info" style="flex: 1;">
                        <h3>${item.name}</h3>
                        <p style="color: var(--primary); font-weight: 700;">$${item.price.toFixed(2)}</p>
                    </div>
                    <div class="cart-qty-control">
                        <button onclick="window.changeQty(${index}, -1)" class="qty-btn"><i class="ph ph-minus"></i></button>
                        <span>${item.qty}</span>
                        <button onclick="window.changeQty(${index}, 1)" class="qty-btn"><i class="ph ph-plus"></i></button>
                    </div>
                    <button onclick="window.removeItem(${index})" style="background: transparent; border: none; color: #ef4444; font-size: 1.5rem; cursor: pointer;">
                        <i class="ph ph-trash"></i>
                    </button>
                </div>
            `).join('');

            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            totalEl.textContent = `$${total.toFixed(2)}`;
            subtotalEl.textContent = `$${total.toFixed(2)}`;
        };

        window.changeQty = (index, diff) => {
            cart[index].qty += diff;
            if (cart[index].qty < 1) cart[index].qty = 1;
            saveAndRender();
        };

        window.removeItem = (index) => {
            cart.splice(index, 1);
            saveAndRender();
        };

        const saveAndRender = () => {
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart();
            location.reload();
        };

        renderCart();
    </script>
</body>
</html>
